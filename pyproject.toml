[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grok-inspect"
version = "0.1.0"
description = "Cross-platform host inspection agent for sniffing and info-stealing detection with Grok 4.5 analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Grok Inspect" }]
keywords = [
  "security",
  "host-inspection",
  "threat-detection",
  "sniffing",
  "stealer",
  "grok",
  "xai",
  "spacexai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "xai-sdk>=1.0.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "Jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[project.scripts]
grok-inspect = "grok_inspect.cli:app"

# Explicit package layout (src/)
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["grok_inspect*"]

[tool.setuptools.package-data]
grok_inspect = ["report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
